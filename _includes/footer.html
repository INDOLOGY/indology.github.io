<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <p class="footer-line">
      <a class="p-name footer-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      {%- if site.description %}
      <span class="footer-description">{{ site.description | escape }}</span>
      {%- endif %}
    </p>
  </div>

</footer>
